services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scavenger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: scavenger
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scavenger
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    ports:
      - "8081:8081"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=scavenger
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=scavenger
      - REDIS_URL=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - SESSION_TTL=86400
      - PORT:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  data-service:
    build: ./services/data-service
    ports:
      - "8082:8082"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=scavenger
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=scavenger
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=scavenger
      - MINIO_SECRET_KEY=${MINIO_PASSWORD}
      - MINIO_BUCKET=scavenger-files
      - MINIO_USE_SSL=false
      - REDIS_URL=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - AUTH_SERVICE_URL=http://auth-service:8081
      - PORT=8082
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      auth-service:
        condition: service_started

  web-service:
    build: ./services/web-service
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - AUTH_URL=auth-service:8081
      - TIMEOUT=30
      - PORT=8080
    depends_on:
      auth-service:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  redis_data:
